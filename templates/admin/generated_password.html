<!DOCTYPE html>
<html lang="en" class="scroll-smooth motion-reduce:scroll-auto">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Created</title>
  <link rel="icon" type="image/x-icon" href="./static/images/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#1e2a78"
          },
          boxShadow: {
            soft: "0 2px 6px rgba(0,0,0,0.1)"
          }
        }
      }
    };
  </script>
  <style>
    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #f4f7fc;
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(#3a4bb3, #1e2a78);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #16205d;
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: #1e2a78 #f4f7fc;
    }
  </style>
</head>

<body class="bg-[#f8f9fa] p-10 font-sans text-slate-800">
  <main class="mx-auto max-w-[500px] rounded-lg bg-white px-[30px] py-5 shadow-soft">
    <h2 class="text-[28px] font-bold text-primary">Account Created Successfully!</h2>

    <p class="my-2.5 text-base">
      Email: <strong>{{ email }}</strong>
    </p>

    <p class="my-2.5 text-base">
      Password:
      <span class="inline-block rounded bg-[#d4edda] px-[10px] py-1.5 font-bold text-[#155724]">
        {{ password }}
      </span>
    </p>

    <a
      href="{{ url_for('admin.accounts') }}"
      class="mt-5 inline-block font-bold text-primary transition duration-200 ease-in-out hover:opacity-80 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-300">
      Go to Accounts
    </a>
  </main>
</body>

</html>
