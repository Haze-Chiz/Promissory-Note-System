<!DOCTYPE html>
<html lang="en" class="motion-reduce:scroll-auto">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Inactive</title>
  <link rel="icon" type="image/x-icon" href="./static/images/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#1e2a78",
            "primary-light": "#3a4bb3",
            "primary-dark": "#16205d",
            surface: "#ffffff",
            textmain: "#1f2937",
            muted: "#6b7280",
            danger: "#dc2626",
            "danger-soft": "#fef2f2"
          },
          boxShadow: {
            card: "0 18px 40px rgba(0, 0, 0, 0.18)"
          }
        }
      }
    };
  </script>
</head>

<body class="flex min-h-screen items-center justify-center bg-[linear-gradient(160deg,rgba(30,42,120,0.95),rgba(58,75,179,0.92)),linear-gradient(to_bottom,#dbeafe,#ffffff)] p-6 font-sans text-textmain">
  <main
    class="w-full max-w-[460px] rounded-[20px] border border-white/35 bg-surface px-[30px] py-9 text-center shadow-card max-[480px]:px-5 max-[480px]:py-7">
    <div
      class="mx-auto mb-[18px] flex h-[84px] w-[84px] items-center justify-center rounded-full border border-red-200 bg-danger-soft max-[480px]:h-[72px] max-[480px]:w-[72px]">
      <div class="text-[42px] leading-none max-[480px]:text-4xl">⚠️</div>
    </div>

    <h1 class="mb-3 text-[28px] font-bold text-danger max-[480px]:text-2xl">Account Inactive</h1>

    <p class="mb-6 text-[15px] leading-[1.7] text-muted max-[480px]:text-sm">
      Your student account is currently inactive. To request a promissory note, please visit the finance office.
      Contact the administrator to reactivate your account and regain full access.
    </p>

    <a
      href="{{ url_for('logout') }}"
      class="inline-flex w-full items-center justify-center rounded-xl bg-primary px-[18px] py-3 text-[15px] font-bold text-white transition duration-200 ease-in-out hover:-translate-y-px hover:bg-primary-light focus-visible:outline focus-visible:outline-3 focus-visible:outline-offset-3 focus-visible:outline-sky-300 max-[480px]:px-4 max-[480px]:py-[11px] max-[480px]:text-sm motion-reduce:transition-none">
      Return to Login
    </a>

    <div class="mt-4 text-[13px] text-muted">Student Promissory Notes System</div>
  </main>
</body>

</html>
