<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Inactive</title>
  <link rel="icon" type="image/x-icon" href="./static/images/logo.png">

  <style>
    :root {
      --primary: #1e2a78;
      --primary-light: #3a4bb3;
      --primary-dark: #16205d;
      --bg: #f4f7fc;
      --surface: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      --radius: 16px;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      font-family: Arial, sans-serif;
      background:
        linear-gradient(160deg, rgba(30, 42, 120, 0.95), rgba(58, 75, 179, 0.92)),
        linear-gradient(to bottom, #dbeafe, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text);
      padding: 24px;
    }

    .container {
      max-width: 460px;
      width: 100%;
      background: var(--surface);
      padding: 36px 30px;
      border-radius: 20px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.35);
    }

    .icon-wrap {
      width: 84px;
      height: 84px;
      margin: 0 auto 18px;
      border-radius: 999px;
      background: var(--danger-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #fecaca;
    }

    .icon {
      font-size: 42px;
      line-height: 1;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 12px;
      color: var(--danger);
      font-weight: 700;
    }

    p {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 24px;
      line-height: 1.7;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: var(--primary);
      color: #fff;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 12px;
      text-decoration: none;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .btn:hover {
      background: var(--primary-light);
      transform: translateY(-1px);
    }

    .btn:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 3px;
    }

    .small-text {
      margin-top: 16px;
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 480px) {
      .container {
        padding: 28px 20px;
      }

      .icon-wrap {
        width: 72px;
        height: 72px;
      }

      .icon {
        font-size: 36px;
      }

      h1 {
        font-size: 24px;
      }

      p {
        font-size: 14px;
      }

      .btn {
        font-size: 14px;
        padding: 11px 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="icon-wrap">
      <div class="icon">⚠️</div>
    </div>

    <h1>Account Inactive</h1>

    <p>
      Your student account is currently inactive. To request a promissory note, please visit the finance office.
      Contact the administrator to reactivate your account and regain full access.
    </p>

    <a href="{{ url_for('logout') }}" class="btn">Return to Login</a>

    <div class="small-text">Student Promissory Notes System</div>
  </main>
</body>

</html>
