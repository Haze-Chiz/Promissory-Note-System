<!DOCTYPE html>
<html lang="en" class="motion-reduce:scroll-auto">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Promissory App — Login</title>
  <link rel="icon" type="image/x-icon" href="./static/images/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#1e2a78",
            "primary-light": "#3a4bb3",
            "primary-dark": "#16205d",
            "bg-soft": "#dbeafe",
            surface: "#ffffff",
            textmain: "#1f2937",
            muted: "#6b7280",
            borderline: "#d1d5db",
            "success-bg": "#ecfdf5",
            "success-text": "#166534",
            "success-border": "#86efac",
            "danger-bg": "#fef2f2",
            "danger-text": "#991b1b",
            "danger-border": "#fca5a5",
            "warning-bg": "#fffbeb",
            "warning-text": "#92400e",
            "warning-border": "#fcd34d",
            "info-bg": "#ecfeff",
            "info-text": "#155e75",
            "info-border": "#67e8f9"
          },
          boxShadow: {
            card: "0 14px 30px rgba(0, 0, 0, 0.08)",
            image: "0 12px 30px rgba(0, 0, 0, 0.18)",
            flash: "0 4px 12px rgba(0, 0, 0, 0.05)"
          }
        }
      }
    };
  </script>
</head>

<body class="flex min-h-screen flex-col bg-gradient-to-b from-bg-soft to-white font-sans leading-6 text-textmain lg:flex-row">
  <main class="flex flex-1 items-center justify-center p-5 md:p-10">
    <section
      class="flex w-full max-w-[400px] flex-col rounded-2xl bg-surface px-7 py-8 shadow-card max-md:max-w-full"
      aria-labelledby="login-title">
      <div class="mb-[18px] flex justify-center">
        <img
          src="{{ url_for('static', filename='images/logo.png') }}"
          alt="Promissory App logo"
          class="h-[72px] w-[72px] rounded-[14px] object-contain" />
      </div>

      <h1 id="login-title" class="mb-2 text-center text-[28px] font-bold text-primary">Login</h1>
      <p class="mb-[22px] text-center text-sm text-muted">Sign in to continue to Promissory App</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      <div class="mb-4 flex flex-col gap-2.5" aria-live="polite" aria-atomic="true">
        {% for category, message in messages %}
        <div
          class="flash rounded-xl border px-[14px] py-3 text-center text-sm font-semibold shadow-flash
          {% if category == 'success' %}
            border-success-border bg-success-bg text-success-text
          {% elif category == 'danger' %}
            border-danger-border bg-danger-bg text-danger-text
          {% elif category == 'warning' %}
            border-warning-border bg-warning-bg text-warning-text
          {% elif category == 'info' %}
            border-info-border bg-info-bg text-info-text
          {% else %}
            border-slate-200 bg-white text-slate-700
          {% endif %}">
          {{ message }}
        </div>
        {% endfor %}
      </div>
      {% endif %}
      {% endwith %}

      <form method="POST" action="{{ url_for('login') }}" class="flex flex-col gap-[14px]">
        <div class="relative flex flex-col gap-1.5">
          <label for="email" class="text-sm font-semibold text-muted">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            autocomplete="username"
            required
            class="w-full rounded-xl border border-borderline bg-neutral-50 px-3 py-3 text-sm text-textmain transition duration-200 ease-in-out placeholder:text-slate-400 focus:border-indigo-300 focus:bg-white focus:outline-none focus:ring-4 focus:ring-indigo-500/10 focus-visible:outline focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-sky-300 motion-reduce:transition-none" />
        </div>

        <div class="relative flex flex-col gap-1.5">
          <label for="password" class="text-sm font-semibold text-muted">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
            class="w-full rounded-xl border border-borderline bg-neutral-50 px-3 py-3 pr-11 text-sm text-textmain transition duration-200 ease-in-out placeholder:text-slate-400 focus:border-indigo-300 focus:bg-white focus:outline-none focus:ring-4 focus:ring-indigo-500/10 focus-visible:outline focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-sky-300 motion-reduce:transition-none" />
          <button
            type="button"
            class="absolute right-2.5 top-[38px] rounded-lg px-1.5 py-1 text-[13px] font-bold text-primary transition duration-200 ease-in-out hover:bg-indigo-50 focus-visible:outline focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-sky-300 motion-reduce:transition-none"
            id="togglePasswordBtn"
            aria-label="Show password">
            Show
          </button>
        </div>

        <div class="mt-0.5 flex items-center gap-2 text-sm text-muted">
          <input
            type="checkbox"
            id="remember"
            name="remember"
            class="h-4 w-4 cursor-pointer accent-primary focus-visible:outline focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-sky-300" />
          <label for="remember" class="cursor-pointer select-none">Remember Me</label>
        </div>

        <button
          type="submit"
          class="mt-1 inline-flex w-full items-center justify-center rounded-xl bg-primary px-3 py-3 text-[15px] font-bold text-white transition duration-200 ease-in-out hover:-translate-y-px hover:bg-primary-light focus-visible:outline focus-visible:outline-3 focus-visible:outline-offset-2 focus-visible:outline-sky-300 motion-reduce:transition-none">
          LOGIN
        </button>
      </form>
    </section>
  </main>

  <aside
    class="order-first flex flex-1 items-center justify-center bg-gradient-to-br from-primary to-primary-light p-5 md:min-h-[240px] md:p-6 lg:order-none lg:p-8"
    aria-label="App illustration">
    <div class="flex w-full max-w-[520px] items-center justify-center">
      <img
        src="{{ url_for('static', filename='images/FCPC.jpg') }}"
        alt="School logo"
        class="max-h-[180px] max-w-full rounded-[18px] bg-white/10 p-[14px] object-contain shadow-image lg:max-h-[70vh]" />
    </div>
  </aside>

  <script>
    const passwordInput = document.getElementById("password");
    const togglePasswordBtn = document.getElementById("togglePasswordBtn");

    function togglePassword() {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      togglePasswordBtn.textContent = isPassword ? "Hide" : "Show";
      togglePasswordBtn.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
    }

    togglePasswordBtn.addEventListener("click", togglePassword);

    setTimeout(() => {
      document.querySelectorAll(".flash").forEach((flash) => {
        flash.style.transition = "opacity 0.5s ease";
        flash.style.opacity = "0";
        setTimeout(() => flash.remove(), 500);
      });
    }, 5000);
  </script>
</body>

</html>
